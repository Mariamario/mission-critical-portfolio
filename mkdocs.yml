site_name: Mission Critical Portfolio
site_url: https://github.io

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: steel blue
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: steel blue
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - search.suggest
    - search.highlight
    - search.share
    - navigation.tabs
    - navigation.tabs
    - navigation.sections
    - content.code.copy
    - content.code.annotate

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span # Crucial for PyScript text injection hooks
      pygments_lang_class: true # Ensures correct language parsing in WebAssembly
  - pymdownx.superfences: # Combined into a single, clean block
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
nav:
  - Executive Overview: index.md
  - Physical Design & Power Architecture:
      - 2N Redundant SLD Specifications: engineering-design/sld-2n-architecture.md
      - Liquid & Air Cooling Integration: engineering-design/mechanical-cooling.md
  - Python Automation Engines:
      - 3-Phase Analytics & PUE: automation_scripts/power_analytics.py
      - NetBox DCIM API Audit: automation_scripts/netbox_audit.py
  - Operations & MOP Frameworks:
      - Live Zero-Downtime UPS Bypass MOP: mops-sops/live-ups-maintenance.md
  - Commissioning Validation:
      - L1-L5 Commissioning & Blackout IST: commissioning/level1-5-framework.md
  - Enterprise Catalog:
      - Resource Catalog & Link Index: reference-catalog/industry-links.md

plugins:
  - search
  - mkdocs-pyscript

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com
      name: Mariamario on GitHub

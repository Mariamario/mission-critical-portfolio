site_name: Mission Critical Portfolio
site_url: https://github.io

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: steel blue
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: steel blue
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - search.suggest
    - search.highlight
    - search.share
    - navigation.tabs

nav:
  - Executive Summary: index.md
  - Engineering & Design:
    - 2N Architecture & Switchgear: engineering-design/sld-2n-architecture.md
    - Mechanical Cooling & Thermal: engineering-design/mechanical-cooling.md
  - Automation Scripts:
    - 3-Phase Analytics Engine: automation-scripts/power_analytics.py
    - NetBox Redundancy Audit: automation-scripts/netbox_audit.py
  - MOPs & SOPs:
    - Live UPS Bypass Procedure: mops-sops/live-ups-maintenance.md
  - Commissioning Framework:
    - FAT to Level 5 IST Scripts: commissioning/level1-5-framework.md
  - Reference Catalog:
    - Industry Link Index: reference-catalog/industry-links.md

plugins:
  - search

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com
      name: Mariamario on GitHub

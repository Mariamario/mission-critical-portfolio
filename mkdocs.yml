site_name: Senior Mission Critical Electrical Engineer Portfolio
site_url: https://mission-critical-portfolio.pages.dev/

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: cyan
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - search.suggest
    - search.highlight
    - search.share
    - navigation.tabs # Fixed: Removed the duplicate duplicate entry
    - navigation.sections
    - content.code.copy
    - content.code.annotate

# FIXED: Points directly to the actual auto-assembling MathJax engine CDN distribution link
extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - pymdownx.snippets:
      base_path: docs
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Executive Overview: index.md
  - Physical Design & Power Architecture:
      - 2N Redundant SLD Specifications: engineering-design/sld-2n-architecture.md
      - Liquid & Air Cooling Integration: engineering-design/mechanical-cooling.md
  - Python Automation Engines:
      - 3-Phase Analytics & PUE: automation_scripts/power_analytics_view.md
      - NetBox DCIM API Audit: automation_scripts/netbox_audit_view.md
  - Operations & MOP Frameworks:
      - Live Zero-Downtime UPS Bypass MOP: mops-sops/live-ups-maintenance.md
  - Commissioning Validation:
      - L1-L5 Commissioning & Blackout IST: commissioning/level1-5-framework.md
  - Enterprise Catalog:
      - Resource Catalog & Link Index: reference-catalog/industry-links.md

plugins:
  - search
  - mkdocs-pyscript

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com
      name: Mariamario on GitHub
